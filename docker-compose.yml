services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redfirst
      POSTGRES_PASSWORD: redfirst  # local development only
      POSTGRES_DB: redfirst
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
